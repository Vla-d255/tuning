<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ательє японського тюнінгу</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0f;
            background-image: radial-gradient(circle at 80% 0%, rgba(225, 29, 46, 0.18), transparent 45%);
            min-height: 100vh;
        }
        h1, h2 { font-family: 'Russo One', 'Inter', sans-serif; }
        .hero-saas {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #14141a 0%, #3a0a12 55%, #c1121f 100%);
            color: #fff;
            border-radius: 1rem;
            padding: 4rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hero-saas::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                115deg,
                transparent 0 38px,
                rgba(255, 255, 255, 0.03) 38px 40px
            );
            pointer-events: none;
        }
        .hero-saas .container { position: relative; }
        .hero-title { line-height: 1.1; letter-spacing: 0.5px; }
        .hero-title .accent { color: #ff4d5e; }

        .feature-badge {
            background-color: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 0.5rem;
            padding: 0.4rem 0.9rem;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        .btn-tune {
            background: #fff;
            color: #c1121f;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-tune:hover {
            color: #fff;
            background: #e11d2e;
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(255, 77, 94, 0.7) !important;
        }
        .illustration-placeholder {
            position: relative;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 0.75rem;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            overflow: hidden;
            padding: 1.5rem 1rem;
        }
        .illustration-placeholder::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4d5e 0%, #c1121f 60%, transparent 72%);
            opacity: 0.85;
        }
        .car-triangle {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .car-top { width: 62%; }
        .car-bottom {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }
        .car-bottom .car-slot { width: 50%; }
        .car-slot {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .car-img {
            position: relative;
            filter: drop-shadow(0 14px 14px rgba(0, 0, 0, 0.6));
            animation: car-in 0.9s ease-out both;
        }
        .car-slot:nth-child(2) .car-img { animation-delay: 0.15s; }
        .car-hint {
            padding: 0.75rem;
            font-size: 0.8rem;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
        }
        @keyframes car-in {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .car-img { animation: none; }
            .btn-tune { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container-fluid container-sm mt-5">
        <h1 class="text-center mb-5 text-white">Ательє японського тюнінгу</h1>
        <section class="hero-saas shadow">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-7 text-center text-lg-start">
                        <h2 class="display-4 fw-bold mb-3 hero-title">
                            Втілюємо   <span class="accent">JDM-мрії</span> в реальність!
                        </h2>
                        <p class="lead mb-4">
                            Тюнінг Toyota, Nissan, Honda, Mazda та Subaru: потужність двигуна, підвіска, обвіси і стиль, який помітять усі.
                        </p>
                        <div class="container">
                            <div class="row g-2 mb-4">
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">Тюнінг двигуна</div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">Обвіси на замовлення</div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center">Налаштування підвіски</div>
                                </div>
                            </div>
                        </div>
                        <a href="#" class="btn btn-tune btn-light btn-lg rounded-pill px-4 shadow">Записатися на консультацію</a>
                    </div>
                    <div class="col-12 col-lg-5">
                        <div class="illustration-placeholder text-center">
                            <div class="car-triangle">
                                <div class="car-slot car-top">
                                    <img src="2.png" alt="Тюнінгований японський автомобіль 1" class="img-fluid car-img"
                                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                    <span class="car-hint" style="display:none;">car1.png</span>
                                </div>
                                <div class="car-bottom">
                                    <div class="car-slot">
                                        <img src="1.png" alt="Тюнінгований японський автомобіль 2" class="img-fluid car-img"
                                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                        <span class="car-hint" style="display:none;">car2.png</span>
                                    </div>
                                    <div class="car-slot">
                                        <img src="3.png" alt="Тюнінгований японський автомобіль 3" class="img-fluid car-img"
                                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                        <span class="car-hint" style="display:none;">car3.png</span>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
</body>
</html>
